# Neutral dark theme for the PDF converter.
[theme]
base = "dark"
primaryColor = "#6EA8FE"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#171B24"
textColor = "#E6E8EB"
linkColor = "#7AA2F7"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseRadius = "0.5rem"
borderColor = "#2A2F3A"
showWidgetBorder = true

[server]
maxUploadSize = 300

[browser]
gatherUsageStats = false
