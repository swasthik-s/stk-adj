name: Matching logic tests

on:
  pull_request:
    paths:
      - "views/negative_stock.py"
      - "tests/test_matching_logic.py"
      - ".github/workflows/test-matching.yml"
  push:
    branches:
      - main
      - improve-matching-engine-check2

jobs:
  matcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run matcher regression tests
        run: pytest -q
